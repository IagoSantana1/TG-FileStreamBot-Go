name: Build e Deploy Automático

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Go no GitHub
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compilar o binário para Linux (x86_64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o fsb ./cmd/fsb/

      - name: Enviar executável para a VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "fsb"
          target: "/home/ubuntu/TG-FileStreamBot-Go/"

      - name: Conceder permissão e reiniciar o bot na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /home/ubuntu/TG-FileStreamBot-Go/fsb
            sudo systemctl restart tg-bot
